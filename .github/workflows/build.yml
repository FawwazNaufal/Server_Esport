name: CI/CD Pipeline Game Server

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Memberikan izin untuk upload ke GHCR

    steps:
    - name: Checkout kode
      uses: actions/checkout@v3

    - name: Login ke GitHub Container Registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }} # Token ini otomatis disediakan oleh GitHub, tidak perlu disetting manual

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: ghcr.io/fawwaznaufal/my-game-server:latest
